name: Build LKCS Exam Studio (Windows EXE & macOS DMG)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ----------------- WINDOWS BUILD (.exe) -----------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Initialize Database
        run: |
          python -m app.database

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm LKCSExamStudio.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Setup Wizard (Inno Setup)
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc installer.iss
          } else {
              Write-Error "ISCC compiler not found!"
              exit 1
          }

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKCSExamStudio-Windows-Setup-Installer
          path: dist/installer/LKCSExamStudio_Setup.exe

      - name: Upload Windows Standalone EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKCSExamStudio-Windows-EXE
          path: dist/LKCSExamStudio.exe

  # ----------------- macOS BUILD (.dmg) -----------------
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install create-dmg || true

      - name: Initialize Database
        run: |
          python3 -m app.database

      - name: Build macOS App & DMG
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKCSExamStudio-macOS-DMG
          path: dist/LKCSExamStudio.dmg
