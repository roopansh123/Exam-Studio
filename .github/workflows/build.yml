name: Build LKCS Exam Studio (Windows EXE & macOS DMG)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ----------------- WINDOWS BUILD (.exe) -----------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Initialize Database & Logo
        run: |
          python -m app.database
          python generate_logo.py

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm LKCSExamStudio.spec

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKCSExamStudio-Windows-EXE
          path: dist/LKCSExamStudio.exe

  # ----------------- macOS BUILD (.dmg) -----------------
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install create-dmg || true

      - name: Initialize Database & Logo
        run: |
          python3 -m app.database
          python3 generate_logo.py

      - name: Build macOS App & DMG
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKCSExamStudio-macOS-DMG
          path: dist/LKCSExamStudio.dmg
